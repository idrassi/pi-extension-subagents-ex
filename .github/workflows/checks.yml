name: Checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  PI_OFFLINE: "1"

jobs:
  minimum-smoke:
    name: Minimum production APIs / Node 22.19.0 / pi 0.86.0
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.19.0"
          cache: npm
      - run: npm ci
      - name: Select minimum SDK
        run: >-
          npm install --no-save --package-lock=false
          @earendil-works/pi-agent-core@0.86.0
          @earendil-works/pi-ai@0.86.0
          @earendil-works/pi-coding-agent@0.86.0
          @earendil-works/pi-tui@0.86.0
      - run: npm run check:production
      # The full integration fixture also exercises executeTool/agent_before_settle,
      # which are newer than this SDK. Do not pretend those APIs exist at the floor.
      - run: >-
          node --test tests/agents.test.ts tests/contracts.test.ts tests/plan.test.ts
          tests/runner.test.ts tests/store.test.ts tests/worktree.test.ts
          tests/request-guard.test.ts tests/measurement.test.ts

  test:
    name: ${{ matrix.os }} / Node ${{ matrix.node }} / pi ${{ matrix.pi }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ["22.19.0", "24"]
        pi: ["0.99.1", "1.5.0"]
        exclude:
          - os: macos-latest
            node: "22.19.0"
          - os: windows-latest
            node: "22.19.0"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: Select SDK version
        run: >-
          npm install --no-save --package-lock=false
          @earendil-works/pi-agent-core@${{ matrix.pi }}
          @earendil-works/pi-ai@${{ matrix.pi }}
          @earendil-works/pi-coding-agent@${{ matrix.pi }}
          @earendil-works/pi-tui@${{ matrix.pi }}
      - run: npm run check
      - run: npm run eval -- --check-fixtures
      - name: Test deterministic subprocesses and offline providers
        run: |
          set -o pipefail
          npm test 2>&1 | tee test-output.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tests-${{ matrix.os }}-node-${{ matrix.node }}-pi-${{ matrix.pi }}
          path: test-output.log
          if-no-files-found: ignore
